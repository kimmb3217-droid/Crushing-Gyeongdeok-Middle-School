<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>경덕중학교 뿌시기 · 모바일 테스트</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b2638;--line:#33445d;--cyan:#61e7ff;--text:#eef5ff;--muted:#aab8cc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text);touch-action:none}
#game{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px;gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand,.stats,.hint,.weapons,.reset{background:#111b2bdc;border:1px solid #33445dcc;backdrop-filter:blur(8px);border-radius:14px;box-shadow:0 8px 28px #0003}
.brand{padding:10px 13px;max-width:65%}.brand strong{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.stats{padding:9px 11px;text-align:right;font-size:12px;line-height:1.65;white-space:nowrap}.stats b{color:var(--cyan)}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}.hint{padding:9px 11px;color:#c2d0e3;font-size:11px;max-width:47%;line-height:1.4}.controls{display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:auto}
.weapons{display:flex;padding:5px;gap:4px}.weapon,.reset{border:1px solid #41536d;background:#1b2a40;color:var(--text);border-radius:10px;padding:10px 11px;font-weight:700;font-size:12px;min-height:42px;touch-action:manipulation}
.weapon.active{background:#17445b;border-color:var(--cyan);color:#9af0ff;box-shadow:inset 0 0 0 1px #61e7ff55}
.reset{background:#243149}.toast{position:fixed;left:50%;top:19%;transform:translateX(-50%);padding:9px 13px;background:#07111eea;border:1px solid #4a607a;border-radius:999px;font-size:12px;opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}
@media(min-width:700px){.hud{padding:20px}.brand strong{font-size:18px}.brand small,.hint{font-size:13px}.weapon,.reset{font-size:14px;padding:12px 16px}}
</style>
</head>
<body>
<canvas id="game" aria-label="가상의 학교 건물 게임"></canvas>
<div class="hud">
 <div class="top">
  <div class="brand"><strong>🏫 경덕중학교 뿌시기</strong><small>가상의 한국 중학교 외관 · 모바일 웹 테스트</small></div>
  <div class="stats">남은 블록 <b id="remaining">105</b><br>공격 횟수 <b id="shots">0</b></div>
 </div>
 <div class="bottom">
  <div class="hint">화면을 드래그해 회전<br>건물을 탭해 공격 · 두 손가락으로 확대/축소</div>
  <div class="controls">
   <div class="weapons">
    <button class="weapon active" data-weapon="laser">레이저</button>
    <button class="weapon" data-weapon="missile">미사일</button>
    <button class="weapon" data-weapon="shock">충격파</button>
   </div>
   <button class="reset" id="reset">↻ 건물 재생성</button>
  </div>
 </div>
</div>
<div class="toast" id="toast">공격!</div>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const remainingEl=document.querySelector('#remaining'),shotsEl=document.querySelector('#shots'),toast=document.querySelector('#toast');
let W=0,H=0,dpr=1,angle=-.55,zoom=1,weapon='laser',shots=0,blocks=[],effects=[],toastTimer;
const COLS=7,ROWS=3,DEPTH=5;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
window.addEventListener('resize',resize);
function reset(){blocks=[];for(let y=0;y<ROWS;y++)for(let z=0;z<DEPTH;z++)for(let x=0;x<COLS;x++)blocks.push({x:x-(COLS-1)/2,y,z:z-(DEPTH-1)/2,hp:1+((x+z+y)%4===0?1:0),alive:true,id:blocks.length});shots=0;effects=[];updateStats();draw();say('새 건물을 만들었어')}
function updateStats(){remainingEl.textContent=blocks.filter(b=>b.alive).length;shotsEl.textContent=shots}
function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),950)}
function project(b){let c=Math.cos(angle),s=Math.sin(angle),rx=b.x*c-b.z*s,rz=b.x*s+b.z*c;let unit=Math.min(W/(COLS+DEPTH+3),H/(ROWS+COLS*.45+DEPTH*.45+3))*zoom;let cx=W*.5,cy=H*.51;return {x:cx+(rx-rz)*unit*.68,y:cy+(rx+rz)*unit*.34-b.y*unit*.82,unit,depth:rx+rz+b.y*.5}}
function poly(points,fill,stroke='#0d1827'){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
function cube(b){let p=project(b),u=p.unit*.34;let x=p.x,y=p.y;let top=[{x:x,y:y-u},{x:x+u,y:y-u*.5},{x:x,y:y},{x:x-u,y:y-u*.5}];let left=[{x:x-u,y:y-u*.5},{x:x,y:y},{x:x,y:y+u*1.15},{x:x-u,y:y+u*.65}];let right=[{x:x,y:y},{x:x+u,y:y-u*.5},{x:x+u,y:y+u*.65},{x:x,y:y+u*1.15}];let hue=195+(b.x+b.z)*2;let health=b.hp===2?'#7f94a9':'#607b95';poly(left,'#344a61');poly(right,health);poly(top,b.hp===2?'#91b1c9':'#8ba7bd');return {b,depth:p.depth,points:[...top,...left,...right],cx:x,cy:y+u*.25,rad:u*1.5}}
function draw(){if(!W||!H)return;ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14243a');g.addColorStop(1,'#263b4e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // stars / subtle background
 ctx.fillStyle='#ffffff10';for(let i=0;i<28;i++){let x=(i*97+31)%W,y=(i*61+17)%(H*.65);ctx.fillRect(x,y,2,2)}
 let unit=Math.min(W/(COLS+DEPTH+3),H/(ROWS+COLS*.45+DEPTH*.45+3))*zoom;
 // ground plane
 let ground=project({x:0,y:-.05,z:0}),r=unit*3.8;ctx.beginPath();ctx.ellipse(W*.5,H*.62,r*1.35,r*.68,0,0,Math.PI*2);ctx.fillStyle='#49627355';ctx.fill();ctx.strokeStyle='#7891a566';ctx.stroke();
 // 건물 전체를 하나의 학교 외관으로 렌더링 (개별 큐브 타일 대신)
 const alive=blocks.filter(b=>b.alive).length, total=blocks.length, damageRatio=alive/total;
 const bw=Math.min(W*.72,unit*COLS*1.22), bh=Math.min(H*.38,unit*ROWS*1.45);
 const x=W*.5-bw*.52, y=H*.30, side=bw*.17, roofH=bh*.12;
 const front=[{x:x,y:y+roofH},{x:x+bw,y:y+roofH},{x:x+bw,y:y+bh},{x:x,y:y+bh}];
 // 측면과 지붕
 poly([{x:x+bw,y:y+roofH},{x:x+bw+side,y:y},{x:x+bw+side,y:y+bh-roofH*.2},{x:x+bw,y:y+bh}], '#718697');
 poly([{x:x,y:y+roofH},{x:x+side,y:y},{x:x+bw+side,y:y},{x:x+bw,y:y+roofH}], '#e8eef2');
 // 정면 외벽
 poly(front, '#d9e2e8');
 // 층별 띠와 창문
 const floors=3, windows=7, fw=bw/windows, fh=(bh-roofH)/(floors+0.6);
 for(let row=0;row<floors;row++){
   const wy=y+roofH+row*fh+fh*.2;
   for(let col=0;col<windows;col++){
     const wx=x+col*fw+fw*.23, ww=fw*.52, wh=fh*.48;
     const idx=row*windows+col;
     const destroyed=idx>=Math.floor(damageRatio*floors*windows);
     if(!destroyed){
       ctx.fillStyle='#4d7e9b';ctx.fillRect(wx,wy,ww,wh);
       ctx.strokeStyle='#f5fafc';ctx.lineWidth=Math.max(1,unit*.025);ctx.strokeRect(wx,wy,ww,wh);
       ctx.beginPath();ctx.moveTo(wx+ww/2,wy);ctx.lineTo(wx+ww/2,wy+wh);ctx.stroke();
     }else{
       ctx.fillStyle='#263746';ctx.fillRect(wx,wy,ww,wh);
       ctx.strokeStyle='#526575';ctx.strokeRect(wx,wy,ww,wh);
     }
   }
   ctx.fillStyle='#b8c8d2';ctx.fillRect(x,y+roofH+(row+1)*fh,bw,Math.max(1,unit*.035));
 }
 // 중앙 출입구와 학교 표지판
 const doorW=bw*.105,doorH=bh*.24,doorX=x+bw*.45,doorY=y+bh-doorH;
 ctx.fillStyle='#314b60';ctx.fillRect(doorX,doorY,doorW,doorH);
 ctx.fillStyle='#a8c7d8';ctx.fillRect(doorX+doorW*.12,doorY+doorH*.12,doorW*.76,doorH*.36);
 ctx.fillStyle='#17344b';ctx.fillRect(x+bw*.34,y+roofH*.25,bw*.32,Math.max(14,roofH*.48));
 ctx.fillStyle='#f5fbff';ctx.font='bold '+Math.max(10,Math.min(16,bw*.025))+'px sans-serif';
 ctx.textAlign='center';ctx.fillText('경덕중학교',x+bw*.50,y+roofH*.60);
 // 파괴 효과는 건물 정면에만 표시되며, 외형은 학교 건물로 유지
 if(damageRatio<.98){
   for(let i=0;i<Math.floor((1-damageRatio)*12);i++){
     const dx=x+bw*(.12+((i*37)%75)/100),dy=y+roofH+bh*(.12+((i*23)%65)/100);
     ctx.fillStyle='#273746';ctx.fillRect(dx,dy,Math.max(3,unit*.12),Math.max(3,unit*.1));
   }
 }
 for(const e of effects){let t=1-e.life/e.max;if(e.type==='beam'){ctx.strokeStyle='#7cf3ff';ctx.lineWidth=3*(1-t)+.5;ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.lineTo(e.x2,e.y2);ctx.stroke();ctx.strokeStyle='#e3ffff';ctx.lineWidth=1;ctx.stroke()}else{ctx.beginPath();ctx.arc(e.x,e.y,e.r*t,0,Math.PI*2);ctx.strokeStyle=e.color;ctx.lineWidth=4*(1-t)+1;ctx.stroke();ctx.fillStyle=e.color+'22';ctx.fill()}}
 updateStats();
}
function nearest(px,py){let best=null,bd=Infinity;for(const b of blocks){if(!b.alive)continue;let p=project(b),u=p.unit*.34,dx=px-p.x,dy=py-(p.y+u*.2),d=dx*dx+dy*dy*.7;if(d<bd){bd=d;best=b}}return bd<Math.pow(Math.min(W,H)*.28,2)?best:null}
function attack(px,py){let b=nearest(px,py);if(!b){say('건물 블록을 탭해 줘');return}shots++;let target=project(b);if(weapon==='laser'){damage(b,2);effects.push({type:'beam',x1:W*.5,y1:H*.77,x2:target.x,y2:target.y,life:12,max:12});say('레이저 발사!')}else if(weapon==='missile'){area(b,1,3);effects.push({type:'burst',x:target.x,y:target.y,r:Math.min(W,H)*.18,life:20,max:20,color:'#ff9c52'});say('미사일 폭발!')}else{area(b,2,2);effects.push({type:'burst',x:target.x,y:target.y,r:Math.min(W,H)*.32,life:26,max:26,color:'#b18aff'});say('충격파 발생!')}updateStats();draw()}
function damage(b,n){b.hp-=n;if(b.hp<=0)b.alive=false}
function area(center,r,n){for(const b of blocks){if(!b.alive)continue;let d=Math.abs(b.x-center.x)+Math.abs(b.z-center.z)+Math.abs(b.y-center.y);if(d<=r)damage(b,n)}}
document.querySelectorAll('.weapon').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();weapon=btn.dataset.weapon;document.querySelectorAll('.weapon').forEach(x=>x.classList.toggle('active',x===btn));say(({laser:'레이저 선택',missile:'미사일 선택',shock:'충격파 선택'})[weapon])}));
document.querySelector('#reset').addEventListener('click',reset);
let pointers=new Map(),lastX=0,lastY=0,lastPinch=0,moved=false;
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});lastX=e.clientX;lastY=e.clientY;moved=false;if(pointers.size===2){let a=[...pointers.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{...old,x:e.clientX,y:e.clientY});if(pointers.size>=2){let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)zoom=Math.max(.65,Math.min(1.8,zoom*dist/lastPinch));lastPinch=dist;moved=true;draw()}else{let dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(moved){angle+=dx*.012;zoom=Math.max(.65,Math.min(1.8,zoom-dy*.001));draw()}}lastX=e.clientX;lastY=e.clientY});
function pointerEnd(e){let p=pointers.get(e.pointerId);if(p&&pointers.size===1&&!moved){attack(p.x,p.y)}pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=0}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.8,zoom-e.deltaY*.001));draw()},{passive:false});
function animate(){let changed=false;for(let i=effects.length-1;i>=0;i--){effects[i].life--;if(effects[i].life<=0)effects.splice(i,1);changed=true}if(changed)draw();requestAnimationFrame(animate)}
reset();resize();animate();
})();
</script>
</body>
</html>

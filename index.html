<!doctype html>
<html lang="ko">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>경덕중학교 3D 캠퍼스 샌드박스</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#111b2be8;--line:#33445d;--cyan:#61e7ff;--text:#eef5ff;--muted:#aab8cc}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text);touch-action:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px;gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.brand,.stats,.hint,.weapons,.reset{background:var(--panel);border:1px solid #33445dcc;backdrop-filter:blur(8px);border-radius:14px;box-shadow:0 8px 28px #0003}
.brand{padding:10px 13px;max-width:70%}.brand strong{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.stats{padding:9px 11px;text-align:right;font-size:12px;line-height:1.65;white-space:nowrap}.stats b{color:var(--cyan)}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}.hint{padding:9px 11px;color:#c2d0e3;font-size:11px;max-width:46%;line-height:1.45}.controls{display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:auto}
.weapons{display:flex;padding:5px;gap:4px}.weapon,.reset{border:1px solid #41536d;background:#1b2a40;color:var(--text);border-radius:10px;padding:10px 11px;font-weight:700;font-size:12px;min-height:42px;touch-action:manipulation}
.weapon.active{background:#17445b;border-color:var(--cyan);color:#9af0ff;box-shadow:inset 0 0 0 1px #61e7ff55}.reset{background:#243149}
.toast{position:fixed;left:50%;top:19%;transform:translateX(-50%);padding:9px 13px;background:#07111eea;border:1px solid #4a607a;border-radius:999px;font-size:12px;opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}
@media(min-width:700px){.hud{padding:20px}.brand strong{font-size:18px}.brand small,.hint{font-size:13px}.weapon,.reset{font-size:14px;padding:12px 16px}}
</style>
</head>
<body>
<canvas id="view" aria-label="회전하고 상호작용할 수 있는 가상 3D 학교 건물"></canvas>
<div class="hud">
 <div class="top">
  <div class="brand"><strong>🏫 경덕중학교 3D 캠퍼스</strong><small>사진을 참고해 재구성한 3D 캠퍼스 모델</small></div>
  <div class="stats">건물 상태 <b id="remaining">100%</b><br>작동 횟수 <b id="shots">0</b></div>
 </div>
 <div class="bottom">
  <div class="hint">드래그: 3D 회전<br>두 손가락/휠: 확대·축소<br>건물을 누르면 주변까지 시원하게 파괴</div>
  <div class="controls">
   <div class="weapons">
    <button class="weapon" data-weapon="hammer"><span aria-hidden="true">🔨</span> 망치</button>
    <button class="weapon active" data-weapon="bat"><span aria-hidden="true">⚾</span> 야구 빠따</button>
   </div>
   <button class="reset" id="reset">↻ 다시 만들기</button>
  </div>
 </div>
</div>

  box(.72,.62,.07,warmGlass,[x,1.15,z-1.29],building,false);
 }
 // Painted pedestrian crossing and curb markings at the street junction.
 for(let i=0;i<7;i++)box(.42,.025,1.4,mat('#eee9d9'),[12.0+i*.52,.01,-11.0],building,false);
 for(let i=0;i<10;i++)box(.12,.025,.65,mat('#e7e1d1'),[8.1+i*.72,.01,-11.65],building,false);

 scene.add(building);
 updateStatus();controls.target.set(-2,2.4,0);controls.update();
}
function updateStatus(){const intact=parts.filter(p=>p.visible).length;remainingEl.textContent=Math.round(intact/Math.max(parts.length,1)*100)+'%';shotsEl.textContent=shots}
function say(s){}
function makeToolVisual(point,normal,screenX){
 const tool=new THREE.Group();
 const wood=new THREE.MeshStandardMaterial({color:weapon==='hammer'?'#79502f':'#b98245',roughness:.52});
 const darkWood=new THREE.MeshStandardMaterial({color:'#342820',roughness:.78});
 const metal=new THREE.MeshStandardMaterial({color:'#aeb8c1',metalness:.78,roughness:.25});
 if(weapon==='hammer'){
  const handle=new THREE.Mesh(new THREE.CylinderGeometry(.105,.14,1.9,12),wood);handle.position.y=-.22;tool.add(handle);
  const grip=new THREE.Mesh(new THREE.CylinderGeometry(.13,.12,.42,12),darkWood);grip.position.y=-1.0;tool.add(grip);
  const head=new THREE.Mesh(new THREE.BoxGeometry(1.12,.42,.44),metal);head.position.set(0,.7,0);tool.add(head);
  const claw=new THREE.Mesh(new THREE.BoxGeometry(.22,.34,.4),metal);claw.position.set(.57,.68,0);claw.rotation.z=-.28;tool.add(claw);
 }else{
  // New bat: light ash wood, rounded barrel, tapered neck, wrapped black grip and end cap.
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.205,.34,1.72,24),wood);barrel.position.y=.52;tool.add(barrel);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(.205,20,12),wood);tip.scale.set(1, .42, 1);tip.position.y=1.38;tool.add(tip);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.115,.205,.58,18),wood);neck.position.y=-.62;tool.add(neck);
  const grip=new THREE.Mesh(new THREE.CylinderGeometry(.11,.115,.64,18),darkWood);grip.position.y=-1.18;tool.add(grip);
  for(let i=0;i<6;i++){const wrap=new THREE.Mesh(new THREE.TorusGeometry(.113,.012,6,18),new THREE.MeshStandardMaterial({color:i%2?'#77716b':'#272727',roughness:.85}));wrap.rotation.x=Math.PI/2;wrap.position.y=-1.43+i*.085;tool.add(wrap);}
  const knob=new THREE.Mesh(new THREE.SphereGeometry(.145,16,10),darkWood);knob.scale.set(1,.55,1);knob.position.y=-1.54;tool.add(knob);
 }
 tool.scale.setScalar(1.65);
 const towardViewer=camera.position.clone().sub(point).normalize();
 const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion).normalize();
 const side=Math.abs(screenX)<.16?0:(screenX>0?1:-1);
 let start,end,travel;
 if(side===0){
  start=point.clone().add(new THREE.Vector3(0,4.8,0)).addScaledVector(towardViewer,3.0);
 }else{
  start=point.clone().addScaledVector(right,side*3.6).add(new THREE.Vector3(0,1.55,0)).addScaledVector(towardViewer,3.0);
 }
 // End the bat/hammer animation where the striking end meets the clicked point.
 travel=point.clone().sub(start).normalize();
 end=point.clone().addScaledVector(travel,-2.15);
 tool.position.copy(start);tool.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),travel);scene.add(tool);
 effects.push({obj:tool,life:16,max:16,toolSwing:true,start:start.clone(),end,travel});
}
function damageLocalPatch(p,point,normal){
 // Smash-style destruction: remove the actual mesh instead of subdividing it into cubes.
 if(!p||!p.visible)return [];
 const center=p.getWorldPosition(new THREE.Vector3());
 const scale=p.getWorldScale(new THREE.Vector3());
 const size=new THREE.Vector3(Math.abs(scale.x),Math.abs(scale.y),Math.abs(scale.z));
 p.visible=false;
 return [{center,size,material:p.material,geometry:p.geometry,source:p,normal:normal.clone()}];
}
function makeDebris(cell,point,normal,power){
 const out=[];
 const sourceMat=Array.isArray(cell.material)?cell.material[0]:cell.material;
 const color=sourceMat?.color?sourceMat.color.clone():new THREE.Color('#9ba9b0');
 const count=Math.min(12,Math.max(4,Math.ceil((cell.size.x+cell.size.y+cell.size.z)*2.2)));
 for(let i=0;i<count;i++){
  // Irregular chips and splinters, not a grid of box-shaped building blocks.
  const shard=(i%3===0)
   ?new THREE.Mesh(new THREE.ConeGeometry(.10+Math.random()*.18,.24+Math.random()*.42,5),new THREE.MeshStandardMaterial({color,roughness:.82}))
   :new THREE.Mesh(new THREE.IcosahedronGeometry(.10+Math.random()*.22,0),new THREE.MeshStandardMaterial({color,roughness:.86}));
  shard.scale.set(.65+Math.random()*.9,.55+Math.random()*1.15,.65+Math.random()*.9);
  shard.position.copy(cell.center).add(new THREE.Vector3((Math.random()-.5)*Math.max(.2,cell.size.x*.62),(Math.random()-.5)*Math.max(.2,cell.size.y*.62),(Math.random()-.5)*Math.max(.2,cell.size.z*.62)));
  shard.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
  shard.castShadow=true;scene.add(shard);
  const dir=shard.position.clone().sub(point);
  if(dir.lengthSq()<.04)dir.copy(normal);
  dir.normalize().addScaledVector(normal,.35).normalize();
  const velocity=dir.multiplyScalar(power*(.65+Math.random()*1.15));
  velocity.y+=.18+Math.random()*.48;
  out.push({obj:shard,life:170+Math.random()*70,max:240,velocity,angular:new THREE.Vector3((Math.random()-.5)*.34,(Math.random()-.5)*.34,(Math.random()-.5)*.34),fragment:true,bounces:0});
 }
 return out;
}
function hit(point,normal,screenX,targetObject){
 shots++;makeToolVisual(point,normal,screenX);
 shakePower=Math.min(.9,shakePower+(weapon==='hammer'?.28:.52));
 const radius=weapon==='bat'?2.65:1.45;
 const targets=parts.filter(p=>p.visible&&p.userData.destructible!==false).map(p=>{
  const center=p.getWorldPosition(new THREE.Vector3()),s=p.getWorldScale(new THREE.Vector3());
  const nearest=new THREE.Vector3(
   THREE.MathUtils.clamp(point.x,center.x-Math.abs(s.x)/2,center.x+Math.abs(s.x)/2),
   THREE.MathUtils.clamp(point.y,center.y-Math.abs(s.y)/2,center.y+Math.abs(s.y)/2),
   THREE.MathUtils.clamp(point.z,center.z-Math.abs(s.z)/2,center.z+Math.abs(s.z)/2));
  return {p,center,dist:nearest.distanceTo(point)};
 }).filter(o=>o.p===targetObject||o.dist<radius).sort((a,b)=>(a.p===targetObject?-1:b.p===targetObject?1:a.dist-b.dist));
 const impactNormal=normal.clone().normalize();
 const power=weapon==='bat'?1.15:.72;
 let debris=0;
 for(const item of targets){
  if(debris>=30)break;
  const cells=damageLocalPatch(item.p,point,impactNormal);
  for(const cell of cells){
   const shards=makeDebris(cell,point,impactNormal,power);
   for(const shard of shards){
    if(debris>=30){scene.remove(shard.obj);shard.obj.geometry.dispose();shard.obj.material.dispose();continue;}
    effects.push(shard);debris++;
   }
  }
 }
 // A visible expanding impact ring and dust puff sell the hit without block-grid visuals.
 const ring=new THREE.Mesh(new THREE.RingGeometry(.18,.28,32),new THREE.MeshBasicMaterial({color:weapon==='bat'?'#ffd28a':'#d9e6ed',transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false}));
 ring.position.copy(point).addScaledVector(impactNormal,.035);
 ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),impactNormal);
 scene.add(ring);effects.push({obj:ring,life:18,max:18,scale:7,ring:true});
 const puff=new THREE.Mesh(new THREE.IcosahedronGeometry(.25,1),new THREE.MeshBasicMaterial({color:'#d9d2c4',transparent:true,opacity:.62,depthWrite:false}));
 puff.position.copy(point);scene.add(puff);effects.push({obj:puff,life:18,max:18,scale:3.6});
 updateStatus();
}
const pickables=()=>parts.filter(p=>p.visible);
renderer.domElement.addEventListener('pointerup',e=>{
 if(renderer.domElement.__dragged){renderer.domElement.__dragged=false;return}
 const rect=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-rect.left)/rect.width*2-1;pointer.y=-(e.clientY-rect.top)/rect.height*2+1;
 raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(pickables(),false);
 if(hits.length){
  const hitInfo=hits[0],worldNormal=hitInfo.face?hitInfo.face.normal.clone().applyMatrix3(new THREE.Matrix3().getNormalMatrix(hitInfo.object.matrixWorld)):new THREE.Vector3(0,0,1);
  hit(hitInfo.point,worldNormal,pointer.x,hitInfo.object);
 }
});
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};renderer.domElement.__dragged=false});
renderer.domElement.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)renderer.domElement.__dragged=true});
renderer.domElement.addEventListener('pointercancel',()=>{down=null});renderer.domElement.addEventListener('pointerup',()=>{down=null});
document.querySelectorAll('.weapon').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();weapon=btn.dataset.weapon;document.querySelectorAll('.weapon').forEach(x=>x.classList.toggle('active',x===btn));say(({hammer:'망치 선택',bat:'야구 빠따 선택'})[weapon])}));
document.querySelector('#reset').addEventListener('click',()=>{shots=0;build();say('건물을 다시 만들었어')});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65))}
window.addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);controls.update();if(shakePower>0.002){const j=shakePower;camera.position.add(new THREE.Vector3((Math.random()-.5)*j,(Math.random()-.5)*j,(Math.random()-.5)*j));shakePower*=.86;}for(let i=effects.length-1;i>=0;i--){const e=effects[i];e.life--;if(e.toolSwing){const t=1-e.life/e.max;const swing=THREE.MathUtils.smoothstep(Math.min(1,t*1.28),0,1);e.obj.position.lerpVectors(e.start,e.end,swing);}else if(e.ring){const t=1-e.life/e.max;e.obj.scale.setScalar(1+t*(e.scale||1));e.obj.material.opacity=Math.max(0,1-t);}else if(e.fragment){e.velocity.y-=.012;e.obj.position.add(e.velocity);e.obj.rotation.x+=e.angular.x;e.obj.rotation.y+=e.angular.y;e.obj.rotation.z+=e.angular.z;if(e.obj.position.y<.12){e.obj.position.y=.12;if(e.velocity.y<0){e.velocity.y=-e.velocity.y*(e.bounces===0?.42:.18);e.velocity.x*=.72;e.velocity.z*=.72;e.bounces++;}if(Math.abs(e.velocity.y)<.025&&e.bounces>1){e.velocity.y=0;e.velocity.x*=.94;e.velocity.z*=.94;}}e.obj.material.transparent=true;e.obj.material.opacity=Math.min(1,e.life/30)}else{const t=1-e.life/e.max;e.obj.scale.setScalar(1+t*(e.scale||1)*2);e.obj.material.opacity=Math.max(0,1-t)}if(e.life<=0){scene.remove(e.obj);e.obj.geometry?.dispose();if(Array.isArray(e.obj.material))e.obj.material.forEach(m=>m.dispose());else e.obj.material?.dispose();effects.splice(i,1)}}renderer.render(scene,camera)}
build();animate();
</script>
